<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <link
   rel="stylesheet"
   type="text/css"
   media="screen"
   href="../textSpawn.css"
  />
  <title>SSE Updates</title>
 </head>
 <body>
  <h1>Status Dashboard</h1>
  <!-- This is the specific tag we want to update -->
  <div id="status-tag">Waiting for connection...</div>

  <div id="events"></div>

  <script>
   const eventSource = new EventSource('/report/childEventsStream');
   //const container = document.getElementById('events');
   //const newElement = document.createElement('p');

   const container = document.getElementById('events');
   document.body.style.fontSize = '30px';
   eventSource.onmessage = (event) => {
    const newElement = document.createElement('p');
    //newElement.textContent = `New message: ${event.data}`;
    newElement.innerHTML = `New message: ${event.data}`;
    container.appendChild(newElement);
   };

   // Optional: Handle errors or closed connections
   eventSource.onerror = (error) => {
    console.error('EventSource failed:', error);
    eventSource.close();
   };
  </script>
 </body>
</html>
